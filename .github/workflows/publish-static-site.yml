name: Publish website data

# Admin modalida tanlangan to‘liq baza yoki o‘zgarishlar nashr qilinadi.
# Supabase -> savollar snapshot'i (public/data) -> shu repoga push -> Vercel qayta deploy.
on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Eski admin versiyasi yuboradigan snapshot hash'i (ixtiyoriy)
        required: false
        type: string
      publish_mode:
        description: To‘liq baza yoki faqat o‘zgarishlarni nashr qilish
        required: true
        type: choice
        options:
          - full
          - changes
        default: changes

permissions:
  contents: write

concurrency:
  group: publish-static-site
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out website repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --omit=dev --ignore-scripts

      - name: Build static question snapshot
        run: node scripts/publish-static-site.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PUBLISH_MODE: ${{ inputs.publish_mode }}
          EXPECTED_SNAPSHOT_VERSION: ${{ inputs.expected_version }}

      - name: Commit and push published files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/data
          if git diff --cached --quiet; then
            echo "Static website data is already up to date."
            exit 0
          fi
          git commit -m "Publish website question snapshot"
          git pull --rebase origin main
          git push origin HEAD:main
